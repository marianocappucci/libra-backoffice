# Plantilla del compose del backoffice de UN producto.
#
# Copiar a `/root/<producto>/admin/docker-compose.yml` en el VPS y ajustar el
# slug. Los secretos van en `/etc/<producto>-admin.env` (chmod 600, fuera del
# repo), igual que los backoffices que ya existían.
#
# Tres cosas que no son obvias:
#
# 1. **No publica puertos al host.** El proxy de NPM llega por nombre de
#    contenedor dentro de `stack_stack-net` (patrón 1 de
#    wiki/concepts/nginx-proxy-manager.md), así que no hay que buscar un puerto
#    libre — 8069-8088 ya están todos ocupados.
# 2. **Monta el checkout del producto EN LA MISMA RUTA que en el host**, y el
#    socket de Docker. Lo primero no es capricho: `panel_admin` ejecuta
#    `docker compose -f <ruta>` como subproceso, y esa ruta la resuelve el
#    daemon del HOST. Montando en `/producto` el compose de un cliente pediría
#    un bind de `/producto/clientes/<slug>/data`, que en el host no existe, y
#    Docker crearía un directorio vacío en su lugar: la instancia arrancaría
#    sin sus datos. Con la ruta espejada, lo que ve el contenedor y lo que ve
#    el daemon son lo mismo.
#
#    ⚠️ Montar el socket le da al contenedor control total del Docker del host,
#    o sea root efectivo. Es inherente a lo que hace un backoffice que
#    provisiona instancias — el servicio systemd anterior tenía el mismo poder,
#    sólo que sin contenedor de por medio.
# 3. `image:` con una versión concreta y sin `build:`. La instancia corre un
#    artefacto fijo; nunca `:latest`, que se mueve solo.

name: gestiolibra-admin

services:
  admin:
    image: libra-backoffice:v2026.08.02-0000
    container_name: gestiolibra-admin
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    cpus: 0.5
    healthcheck:
      # Mira el CUERPO y no el codigo HTTP: este backend sirve la SPA del panel
      # con un catch-all, asi que cualquier ruta devuelve 200 y un `urlopen()`
      # a secas no puede fallar. Medido el 2026-08-12 en los 21 contenedores
      # del VPS: los 21 daban exit 0 tambien contra una ruta inventada.
      # `json.load` sobre el index.html revienta, que es lo que se busca.
      #
      # Y el caso que lo vuelve concreto: ese mismo dia los seis backoffices
      # devolvian 500 en `/api/salud` por un pin viejo de libracore, y los seis
      # figuraban `healthy`. Este chequeo no lo habria agarrado tampoco —mide
      # `/health`, no el panel—, pero deja de mentir sobre lo que si mide.
      test: ["CMD", "python3", "-c", "import json,urllib.request; assert isinstance(json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=3)), dict)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    env_file:
      - /etc/gestiolibra-admin.env
    environment:
      - PRODUCT_SLUG=gestiolibra
      - PRODUCT_NAME=Gestiolibra
      - FEATURES=instancias,smtp,usuarios,salud
      # La MISMA ruta que en el host, ver la nota 2 de arriba.
      - REPO_ROOT=/root/gestiolibra
      - DB_FILENAME=gestiolibra.db
      # Los cuatro FastAPI montan el router de SMTP de libraauth en
      # `/admin/smtp` y su router de usuarios en `/users`. Contalibra y
      # Restolibra escriben los suyos: `/api/config/smtp` y `/api/usuarios`.
      - SMTP_PATH=/admin/smtp
      - USERS_PATH=/users
    volumes:
      # El checkout del producto, espejado: de acá sale `clientes/` y de acá se
      # importan `panel_admin.py` / `nuevo_cliente.py` / `plans.py`.
      - /root/gestiolibra:/root/gestiolibra
      # Sin esto el backoffice lista instancias pero no puede operarlas.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - stack-net

networks:
  stack-net:
    external: true
    name: stack_stack-net
