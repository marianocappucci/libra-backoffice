[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libra-backoffice"
version = "0.1.0"
description = "Backoffice de superadmin compartido por los 6 productos de la familia Libra."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # `AdminAuth` (sesion del superadmin del backoffice) y el guard de token de
    # servicio (v0.7.0), que es lo que permite administrar N instancias sin ser
    # usuario de ninguna.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.26.0",
    # `admin.services` (inventario y ciclo de vida de instancias) y
    # `security_headers`. v1.3.0: el alta ya no elige un puerto que otro
    # producto del host tiene bindeado, y hace rollback del directorio si el
    # `docker compose up` falla.
    #
    # 🔴 v1.34.0 NO es un bump de rutina: el pin quedo clavado en v1.3.0 desde
    # el 2026-08-02 mientras los productos avanzaban 31 versiones, y este
    # paquete **importa el `scripts/panel_admin.py` del producto montado desde
    # el host** (`libracore.admin.services._pa()`). O sea que el argumento que
    # ese script le pasa a `configure()` lo tiene que entender la libracore que
    # vive ACA ADENTRO, no la del producto.
    #
    # Roto de verdad el 2026-08-12: Contalibra y Restolibra empezaron a pasar
    # `configure(backup_zip=True)` (commit `acb41be`, la pantalla de Backup
    # saliendo del motor) y los seis backoffices devolvieron **500 en
    # `/api/salud`** con `TypeError: configure() got an unexpected keyword
    # argument 'backup_zip'`. Los contenedores seguian `healthy`: su `/health`
    # no toca ese camino.
    #
    # La leccion, para la proxima: **este pin no es independiente del de los
    # productos**. Si un producto suma un argumento a `configure()`, este
    # paquete se entera recien cuando alguien abre el panel. Y como el import
    # queda cacheado en `sys.modules`, el proceso viejo lo tapa hasta el
    # siguiente reinicio.
    #
    # v1.35.0: `_enrich` devuelve el estado de servicio de cada instancia y
    # `accion_estado` acepta el mensaje que ve el cliente. Sin este bump el
    # corte de servicio de este backoffice le borra el texto al cliente y la
    # pantalla no puede mostrar quien esta cortado —y la suite no lo nota,
    # porque corre contra dobles—. Lo cubre
    # `test_la_libracore_instalada_entiende_el_mensaje_del_corte`, que mira la
    # firma de la libracore **instalada**.
    #
    # 🔴 v1.36.0: el alta genera instancias que ARRANCAN. Hasta v1.35.0 el
    # compose salia con `DATABASE_URL=postgresql://` sin driver, sin las
    # credenciales de admin con el nombre prefijado que lee libraauth, y sin
    # `LIBRA_SERVICE_TOKEN` — o sea que la instancia quedaba en crash loop y,
    # aun arrancando, este backoffice no podia administrarla. Y trae
    # `AltaIncompletaError`, que este repo mapea a 409.
    #
    # **Este bump es el que hace util al alta**: el provisioning corre ACA
    # ADENTRO, asi que el pin de los productos (v1.33.0) no interviene. Sin
    # este bump el fix no llega a ningun lado.
    # 🔴 v1.42.0: el compose de una instancia nueva nace con `LIBRA_PANEL_TOKEN`
    # y el alta exige la identidad fiscal. Hasta v1.41.0 el generador no
    # escribia esa variable: las dos instancias de Contalibra la tienen porque
    # se les puso A MANO el 2026-08-20, y toda instancia creada desde aca
    # despues de esa fecha nacia sin ella. El guard de libraauth es opt-in por
    # ausencia, asi que `/api/resumen` devuelve 401 sin mirar el header y el
    # panel del dueno muestra la sucursal como "sin respuesta" —
    # indistinguible de una caida.
    #
    # **Este bump es el que hace que el arreglo exista**: el provisioning corre
    # ACA ADENTRO, con este `pip install`, asi que el pin de los productos no
    # interviene. Sin el, el generador sigue siendo el de v1.36.0.
    #
    # ⚠️ Cambia el comportamiento del alta: `crear_cliente` rechaza un alta sin
    # CUIT. La validacion es previa a tocar Docker, asi que un rechazo no deja
    # el slug tomado. `InstanciaIn` ya manda `empresa_cuit`/`sin_identidad`.
    # 🔴 v1.51.0: `configure(migraciones=...)`. **Tercera vez que este pin tumba
    # los paneles**, y la primera que se lleva puestos cinco de ocho: el
    # 2026-08-24 LibraDesk, Gestiolibra, LibraCargo, LibraClub y MedLibra
    # sumaron `migraciones=(("alembic", "upgrade", "head"),)` a su
    # `panel_admin.py` para que el deploy aplicara el esquema, y subieron el pin
    # **de sus repos**. Pero ese archivo lo importa TAMBIEN este contenedor, con
    # la libracore de ACA: `TypeError: configure() got an unexpected keyword
    # argument 'migraciones'` en cada `GET /api/instancias`, o sea el panel
    # entero vacio y sin poder dar de alta a nadie.
    #
    # ⚠️ **v1.48.0 NO alcanza**, aunque sea la version que introdujo el
    # argumento: ahi `migraciones` es `tuple[str, ...]` — UN comando. Gestiolibra
    # y MedLibra pasan DOS cadenas (`libragenda-migrar upgrade` y despues
    # `alembic upgrade head`, que tienen FK entre si), y la forma anidada recien
    # existe en v1.51.0 — que ademas rechaza la plana a proposito. Un pin
    # intermedio arregla tres productos y deja dos rotos.
    #
    # La leccion ya estaba escrita mas arriba, en el bloque de v1.34.0, y no
    # alcanzo con escribirla: lo que faltaba era que el `/health` tocara este
    # camino. Desde este mismo cambio lo toca — ver `verificar_scripts()` en
    # `inventario.py`. Un contenedor `healthy` con el panel muerto es la razon
    # por la que las tres veces nos enteramos por el humano.
    # v1.77.0: `libracore.admin.services.set_addon` / `addons_de_instancia` — el
    # backoffice puede prender/apagar un add-on (`plans.ADDONS`, ej. `mayorista`)
    # de una instancia, vía docker exec contra su PostgreSQL. Ver routers/instancias.py.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.77.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    # El control plane le habla a cada instancia por HTTP.
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6",
    "ruff>=0.13",
    # Trae el plugin de pytest que corre los tests `async def`. Sin el, los
    # tests del cliente HTTP se saltearian con un warning y la suite quedaria
    # en verde sin haberlos ejecutado.
    "anyio>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["libra_backoffice"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Mismo ruleset curado que los otros 12 repos de la familia (fijado 2026-07-31):
# da cero hallazgos hoy, asi que cualquier rojo futuro es una regresion real y
# no deuda vieja. F401 queda afuera a proposito -- los re-exports de `__init__.py`
# son API publica, no imports muertos.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F811",
    "F822",
    "F823",
    "F841",
    "F541",
    "F502", "F506", "F522", "F524",
    "F601", "F602",
]

[tool.coverage.run]
source = ["libra_backoffice"]
branch = true
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true
# Trinquete, no meta: fijado 3 puntos por debajo del 96% que medía el repo al
# crearse, asi que hoy pasa holgado y lo unico que puede ponerlo en rojo es una
# regresion. Cuando la cobertura suba de verdad, subir tambien este numero --
# nunca bajarlo para que pase un cambio.
fail_under = 93
