[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libra-backoffice"
version = "0.1.0"
description = "Backoffice de superadmin compartido por los 6 productos de la familia Libra."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # `AdminAuth` (sesion del superadmin del backoffice) y el guard de token de
    # servicio (v0.7.0), que es lo que permite administrar N instancias sin ser
    # usuario de ninguna.
    #
    # v0.40.0 (2026-09-11): `libraauth.captcha`, el captcha ALTCHA del login, y
    # —de v0.39.0— `ip_del_request`, que lee la IP desde la derecha. Las dos
    # cosas las cablea `routers/auth.py`: este backoffice no usa el router de
    # libraauth, así que subir el pin sin tocar el router no cambia nada.
    #
    # v0.41.0 (F3, 2026-09-13): `AdminAuth.iniciar_totp` / `confirmar_totp` /
    # `desactivar_totp` — el segundo factor enrolable en runtime que consume
    # `routers/seguridad.py`, sin tocar el `.env` ni recrear el contenedor.
    #
    # v0.42.0 (F4, 2026-09-13): login en dos pasos. `verificar_clave` valida
    # solo usuario y contrasena; `emitir_desafio_totp` / `validar_desafio_totp`
    # arman y verifican un desafio firmado de vida corta (`DESAFIO_TOTP_SEGUNDOS
    # = 300`) para el segundo paso; `verificar_codigo_totp` valida el codigo
    # TOTP contra ese desafio, compartiendo `ultimo_paso_totp` con
    # `check_credentials` (un codigo usado en un camino no sirve en el otro).
    # `check_credentials` sigue igual, para el camino de un solo paso. Ver
    # ADR-016 de libraauth y `routers/auth.py`.
    #
    # v0.43.0 (2026-09-13): sesion de 8 h sin uso con renovacion deslizante
    # (ADR-017) tambien para `AdminAuth` -- `deps.admin_actual` ahora le pasa
    # `response` a `current_user` para heredarla (ver su docstring: sin el
    # parametro, la sesion del superadmin vencia a las 8 h en punto, la haya
    # usado o no en el medio). Y `libraauth.usuarios` (ADR-018): los modelos
    # publicos `UsuarioAlta`/`UsuarioEdicion`/`UsuarioClaveNueva` que
    # `routers/config_instancia.py` importa en vez de redefinir -- contrato
    # unico de usuarios de la familia, que este backoffice ya no puede volver
    # a hacer divergir.
    # v0.48.0 -> v0.49.0 (2026-10-12): `registrador_dbapi` y el formato del log en funciones puras (ADR-022). Sin migracion.
    # v0.49.0 -> v0.50.0 (2026-10-13): varios procesos (ADR-023): `UsadosEnBase` para el captcha (tabla `libraauth_captcha_usados`, migracion `0003`) y `AdminAuth` con `flock` sobre el JSON de estado.
    # v0.50.0 -> v0.51.0 (2026-10-15, ADR-024): el responsable acepta por adelantado la proxima version de los Terminos (`GET /terminos` suma `proxima`, `POST /aceptar` acepta la vigente o la proxima). Sin migracion; el aviso pide libra-ui v0.153.0.
    # v0.51.0 -> v0.52.0 (2026-10-18, ADR-025): `LIBRA_SERVICE_TOKEN_ANTERIOR` (la instancia acepta el viejo mientras dura una rotación) y la credencial de integración aparte (`LIBRA_INTEGRACION_TOKEN`, `x-integracion-auth`). Sin migracion.
    # v0.52.0 -> v0.53.0 (2026-10-20): la marca Secure de la cookie de sesion es configurable (LIBRAAUTH_COOKIE_SECURE, ADR-026); sin la variable no cambia nada. Sin migracion.
    # v0.53.0 -> v0.54.0 (2026-10-21): en un nodo de LibraEdge los usuarios son los del central (ADR-027); fuera de un nodo no cambia nada. Sin migracion.
    # v0.54.0 -> v0.55.0 (2026-10-21): en un nodo de LibraEdge no se pide captcha y la IP del bloqueo es el par directo (ADR-028); fuera de un nodo no cambia nada. Sin migracion.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.55.0",
    # `admin.services` (inventario y ciclo de vida de instancias) y
    # `security_headers`. v1.3.0: el alta ya no elige un puerto que otro
    # producto del host tiene bindeado, y hace rollback del directorio si el
    # `docker compose up` falla.
    #
    # 🔴 v1.34.0 NO es un bump de rutina: el pin quedo clavado en v1.3.0 desde
    # el 2026-08-02 mientras los productos avanzaban 31 versiones, y este
    # paquete **importa el `scripts/panel_admin.py` del producto montado desde
    # el host** (`libracore.admin.services._pa()`). O sea que el argumento que
    # ese script le pasa a `configure()` lo tiene que entender la libracore que
    # vive ACA ADENTRO, no la del producto.
    #
    # Roto de verdad el 2026-08-12: Contalibra y Restolibra empezaron a pasar
    # `configure(backup_zip=True)` (commit `acb41be`, la pantalla de Backup
    # saliendo del motor) y los seis backoffices devolvieron **500 en
    # `/api/salud`** con `TypeError: configure() got an unexpected keyword
    # argument 'backup_zip'`. Los contenedores seguian `healthy`: su `/health`
    # no toca ese camino.
    #
    # La leccion, para la proxima: **este pin no es independiente del de los
    # productos**. Si un producto suma un argumento a `configure()`, este
    # paquete se entera recien cuando alguien abre el panel. Y como el import
    # queda cacheado en `sys.modules`, el proceso viejo lo tapa hasta el
    # siguiente reinicio.
    #
    # v1.35.0: `_enrich` devuelve el estado de servicio de cada instancia y
    # `accion_estado` acepta el mensaje que ve el cliente. Sin este bump el
    # corte de servicio de este backoffice le borra el texto al cliente y la
    # pantalla no puede mostrar quien esta cortado —y la suite no lo nota,
    # porque corre contra dobles—. Lo cubre
    # `test_la_libracore_instalada_entiende_el_mensaje_del_corte`, que mira la
    # firma de la libracore **instalada**.
    #
    # 🔴 v1.36.0: el alta genera instancias que ARRANCAN. Hasta v1.35.0 el
    # compose salia con `DATABASE_URL=postgresql://` sin driver, sin las
    # credenciales de admin con el nombre prefijado que lee libraauth, y sin
    # `LIBRA_SERVICE_TOKEN` — o sea que la instancia quedaba en crash loop y,
    # aun arrancando, este backoffice no podia administrarla. Y trae
    # `AltaIncompletaError`, que este repo mapea a 409.
    #
    # **Este bump es el que hace util al alta**: el provisioning corre ACA
    # ADENTRO, asi que el pin de los productos (v1.33.0) no interviene. Sin
    # este bump el fix no llega a ningun lado.
    # 🔴 v1.42.0: el compose de una instancia nueva nace con `LIBRA_PANEL_TOKEN`
    # y el alta exige la identidad fiscal. Hasta v1.41.0 el generador no
    # escribia esa variable: las dos instancias de Contalibra la tienen porque
    # se les puso A MANO el 2026-08-20, y toda instancia creada desde aca
    # despues de esa fecha nacia sin ella. El guard de libraauth es opt-in por
    # ausencia, asi que `/api/resumen` devuelve 401 sin mirar el header y el
    # panel del dueno muestra la sucursal como "sin respuesta" —
    # indistinguible de una caida.
    #
    # **Este bump es el que hace que el arreglo exista**: el provisioning corre
    # ACA ADENTRO, con este `pip install`, asi que el pin de los productos no
    # interviene. Sin el, el generador sigue siendo el de v1.36.0.
    #
    # ⚠️ Cambia el comportamiento del alta: `crear_cliente` rechaza un alta sin
    # CUIT. La validacion es previa a tocar Docker, asi que un rechazo no deja
    # el slug tomado. `InstanciaIn` ya manda `empresa_cuit`/`sin_identidad`.
    # 🔴 v1.51.0: `configure(migraciones=...)`. **Tercera vez que este pin tumba
    # los paneles**, y la primera que se lleva puestos cinco de ocho: el
    # 2026-08-24 LibraDesk, Gestiolibra, LibraCargo, LibraClub y MedLibra
    # sumaron `migraciones=(("alembic", "upgrade", "head"),)` a su
    # `panel_admin.py` para que el deploy aplicara el esquema, y subieron el pin
    # **de sus repos**. Pero ese archivo lo importa TAMBIEN este contenedor, con
    # la libracore de ACA: `TypeError: configure() got an unexpected keyword
    # argument 'migraciones'` en cada `GET /api/instancias`, o sea el panel
    # entero vacio y sin poder dar de alta a nadie.
    #
    # ⚠️ **v1.48.0 NO alcanza**, aunque sea la version que introdujo el
    # argumento: ahi `migraciones` es `tuple[str, ...]` — UN comando. Gestiolibra
    # y MedLibra pasan DOS cadenas (`libragenda-migrar upgrade` y despues
    # `alembic upgrade head`, que tienen FK entre si), y la forma anidada recien
    # existe en v1.51.0 — que ademas rechaza la plana a proposito. Un pin
    # intermedio arregla tres productos y deja dos rotos.
    #
    # La leccion ya estaba escrita mas arriba, en el bloque de v1.34.0, y no
    # alcanzo con escribirla: lo que faltaba era que el `/health` tocara este
    # camino. Desde este mismo cambio lo toca — ver `verificar_scripts()` en
    # `inventario.py`. Un contenedor `healthy` con el panel muerto es la razon
    # por la que las tres veces nos enteramos por el humano.
    #
    # 🔑 Desde el 2026-09-11 el acoplamiento se mira en el CI, de los dos lados
    # y antes del deploy: el PR que mueva este pin corre
    # `.github/workflows/scripts-de-productos.yml`, que importa los scripts de
    # `main` y `develop` de los ocho productos con la libracore resultante; y
    # cada producto corre `scripts-de-producto.yml` contra la de `main` de acá.
    # v1.77.0: `libracore.admin.services.set_addon` / `addons_de_instancia` — el
    # backoffice puede prender/apagar un add-on (`plans.ADDONS`, ej. `mayorista`)
    # de una instancia, vía docker exec contra su PostgreSQL. Ver routers/instancias.py.
    #
    # 🔑 v1.123.0 (2026-10-03): el directorio de instancias deja de estar fijo en
    # `repo_root/clientes`. `services._clientes_dir()` lee
    # `get_config().clientes_dir` —parametro de `configure(clientes_dir=)` >
    # variable `LIBRA_CLIENTES_DIR` > `repo_root/clientes`— y **ya no** la
    # constante `panel_admin.CLIENTES_DIR` del producto. El default no cambia.
    # **Este bump es el que hace que `LIBRA_CLIENTES_DIR` valga en este
    # contenedor**: con el pin anterior la variable se ignora en silencio y el
    # backoffice sigue leyendo `repo_root/clientes`. Y un producto que pase
    # `configure(clientes_dir=...)` exige este pin aca adentro (mismo mecanismo
    # que `backup_zip` y `migraciones`). Ver el README, "Donde viven las
    # instancias".
    #
    # El salto v1.110 -> v1.123 trae ademas las migraciones 0013-0015 del
    # esquema de los productos (cobros de cuenta corriente, FCE, `cae_error`);
    # **este paquete no las corre**: no tiene base propia, administra las
    # instancias por `docker exec`. Corren en el deploy de cada producto.
    #
    # v1.134.0 (2026-10-05): igual que el salto anterior, trae migraciones del
    # esquema de los productos (0016 el emisor por comprobante, 0017 la anulacion
    # con rastro) que **este paquete no corre**: corren en el deploy de cada
    # producto (hoy no todas las instancias estan en esta version).
    #
    # v1.147.0 (2026-10-08): `libracore.admin` y `libracore.provisioning` (lo unico que este paquete usa) no cambian entre v1.134.0 y v1.147.0. Igual que
    # los saltos anteriores, trae migraciones del esquema de los productos (0018 a 0022: dinero exacto, libro de terceros, origen del asiento, pre factura,
    # credenciales por servicio) que **este paquete no corre**: corren en el deploy de cada producto.
    # v1.147.0 -> v1.148.0 (2026-10-09): filtros de fecha por dia completo (`libracore.fechas`, ADR-037): una fila con hora del ultimo dia entra en reportes, listados y libros. Sin migracion.
    # v1.149.0 -> v1.151.0 (2026-10-09): un plan retirado se resuelve con `PLANES_RETIRADOS` en el alta y en el cambio de plan (`provisioning.resolver_plan`, libracore#375). Este producto no retira planes: no cambia nada. Sin migracion.
    # v1.152.0 -> v1.153.0 (2026-10-10): sucursales contratadas y abono por unidad adicional (`libracore.limites` y `libracore.abono`, ADR-041). Este producto lo usa. Sin migracion.
    # v1.153.0 -> v1.154.0 (2026-10-12): `libracore.cuit.solo_digitos` y se retira `cc_resumen` (codigo muerto, nadie lo usaba). Sin migracion.
    # v1.154.0 -> v1.155.0 (2026-10-12): migracion 0024 retira cc_resumenes_enviados y clients.cc_resumen_* (ADR-042). Desplegar el producto ANTES de migrar.
    # v1.155.0 -> v1.157.0 (2026-10-12): `libracore.auditoria` (ADR-043): las escrituras de clients avisan a un registrador, apagado si el producto no lo configura. v1.156.0 es un tag erroneo, no usar. Sin migracion.
    # v1.157.0 -> v1.159.0 (2026-10-13): `libracore.candados` (ADR-044) y `libracore.errores` (ADR-045): registro de errores propio, una linea JSON por 500 en `errores.jsonl`. Sin migracion.
    # v1.159.0 -> v1.162.0 (2026-10-13): concepto sin «Factura» doble con migracion 0025 (corre al migrar, backup antes), alta por CLI con aviso de casilla y `panel_admin casilla`, se retira `get_cc_movimientos_periodo` y los adicionales quedan fuera de la escalera de planes (ADR-048, sin migracion).
    # v1.163.0 -> v1.164.0 (2026-10-14): cada envio por mail de un comprobante o un presupuesto deja rastro (`envios_email`, ADR-050 de libracore): `GET .../{id}/envios`, `envios_email` en el detalle y `envio_email` en el listado. **Migracion `0026_envios_email`** (tabla nueva) en la cadena de `libracore-migrar`.
    # v1.164.0 -> v1.166.0 (2026-10-14): incluye v1.165.0 (un proceso sin el almacen de secretos dice la causa) y `GET /api/facturas?envio=enviada|sin_enviar` filtra el listado por el rastro de envios por mail (ADR-051 de libracore). Sin migracion.
    # v1.167.0 -> v1.168.0 (2026-10-15, propuesta; ADR-053 de libracore): `libracore.docs_api.cerrar_docs_de_la_api`: `/docs`, `/redoc` y `/openapi.json` sólo con `ENV=development` (o `LIBRA_DOCS_API=1`); en un cliente real y en la demo dan 404. Sin migracion. `uv.lock` se regenera cuando exista el tag.
    # v1.168.0 -> v1.170.0 (2026-10-15): v1.169.0 suma `fk_de_producto.soltar_fk` (ADR-056; sin efecto en este producto, la usa LibraDesk) y v1.170.0 hace que `delete_client` bloquee la baja de un cliente con cuenta corriente (`cc_pagos`, `cc_debitos`, `recibos` y `cc_asientos` con rol cliente; ADR-057): desactivarlo en vez de borrarlo. Sin migracion.
    # v1.170.0 -> v1.173.0 (2026-10-16): v1.171.0 (ADR-058) no se puede cobrar mas de lo que falta de una factura (409); v1.172.0 (ADR-059 y ADR-060) las notas de credito restan de lo pendiente (resumen y tablero cuentan tambien las cobradas a medias por lo que falta) y cobro por turno; v1.173.0 (ADR-061) una demo no habla con ARCA ni muestra datos fiscales reales (`libracore.demo`). Para este producto no cambia nada (usa `libracore.admin` y `libracore.provisioning`). Sin migracion.
    # v1.173.0 -> v1.176.0 (2026-10-17): v1.174.0 `OpcionesCajas.sucursal_por_defecto` (ADR-062, opt-in); v1.175.0 el pago a cuenta corriente bloquea sus facturas en una transaccion (ADR-063) y la nota de debito tiene tope de cobro (ADR-064, 409 si se cobra de mas); v1.176.0 la NC de una factura al contado cobrada acepta `destino` devolver/a_favor (ADR-065, sin `destino` como antes). Sin migracion.
    # v1.176.0 -> v1.181.0 (2026-10-18): v1.177.0 alta con 2 workers y 2 CPU; v1.178.0 lo pendiente de una ND visible (ADR-066); v1.179.0 la NC sin CAE recuerda el destino de la plata (ADR-067, **migracion 0027 aditiva**); v1.180.0 create_remito(conn=) (ADR-068); v1.181.0 HEAD en montar_spa (ADR-069).
    # v1.181.0 -> v1.182.0 (2026-10-18): un solo reloj de Argentina para «hoy» y «ahora» (ADR-070, libracore.fechas.hoy/ahora). Sin migracion.
    # v1.182.0 -> v1.183.0 (2026-10-18, ADR-071): credenciales de maquina una por instancia. El alta genera `LIBRA_SERVICE_TOKEN` e `LIBRA_INTEGRACION_TOKEN` propios; `admin.services.token_de_servicio(slug)` lee el de la instancia de su compose/.env (lo usa `ClienteInstancia` en cada request); `docker compose` corre sin las credenciales del proceso. Sin migracion.
    # v1.183.0 -> v1.184.0 (2026-10-18): los cobros de MercadoPago con el CUIT de quien factura nacen ignorados y no se auto-facturan (ADR-072); `admin.services.clientes_dir()` publica. Sin migracion.
    # v1.184.0 -> v1.184.1 (2026-10-18): tokens por instancia, `${VAR:?mensaje}` se lee del .env (corrige ADR-071). Sin migracion.
    # v1.184.1 -> v1.185.0 (2026-10-18): la nota de debito de una factura a cuenta corriente hereda la cuenta: asienta su debito y se paga con recibo (ADR-073). Sin migracion.
    # v1.185.0 -> v1.186.0 (2026-10-19): facturar en el nodo de LibraEdge con ticket prestado por el central y bandeja al volver (ADR-074). Sin migracion.
    # v1.186.0 -> v1.186.1 (2026-10-19): la bandeja no deja descartar a mano una venta del nodo (completa ADR-074). Sin migracion.
    # v1.186.1 -> v1.186.2 (2026-10-19): el motor se puede importar en Windows (bloqueo de archivo portable, nodo de LibraEdge). Sin migracion.
    # v1.186.2 -> v1.187.0 (2026-10-20): estado del sistema para la barra del pie (ADR-075). Sin migracion.
    # v1.187.0 -> v1.188.0 (2026-10-21): ganchos de caja para que la caja del nodo suba al central (ADR-076). Migracion 0028 aditiva (origen/origen_id).
    # v1.188.0 -> v1.189.0 (2026-10-21): altas de clientes en un nodo: id provisorio y gancho al crear (ADR-077). Sin migracion.
    # v1.189.0 -> v1.190.0 (2026-10-22): libracore-unir-bases para unir la base core dentro de la del dominio (ADR-078). Sin migracion.
    # v1.190.0 -> v1.190.1 (2026-10-22): LibraCargo y LibraClub en _UNA_SOLA_BASE (ADR-078). Sin migracion.
    # v1.190.1 -> v1.191.0 (2026-10-23): cola de comprobantes del nodo offline (cola_arca, ADR-079). Migracion 0029 aditiva.
    # v1.191.0 -> v1.192.0 (2026-10-24): costuras de caja: corregir, extra y gancho del central (ADR-080). Sin migracion.
    # v1.192.0 -> v1.192.1 (2026-10-24): un ciclo con el candado del esquema da deadlock en 1 s, no a los 120 s (ADR-081). Sin migracion.
    # v1.192.1 -> v1.194.0 (2026-10-25): unir-bases con libraauth en el core (ADR-082), GestioLibra y MedLibra de una sola base y tabla de modulos del producto (ADR-083). Sin migracion.
    # v1.194.0 -> v1.195.0 (2026-10-25): conexion del nodo sin PuertoDeVentas, 202 unico y alta sin la variable del core (ADR-084). Sin migracion.
    # v1.195.0 -> v1.195.1 (2026-10-25): sin los historicos del core de GestioLibra y MedLibra ni la excepcion de VentaLibra (addendum ADR-084). Sin migracion.
    # v1.195.1 -> v1.196.0 (2026-10-26): indices de ajuste (ADR-085, migracion 0030), periodos de contrato y mora (ADR-086).
    # v1.196.0 -> v1.196.1 (2026-10-26): periodo_anclado y sumar_meses publicos (addendum ADR-086). Sin migracion.
    # v1.196.1 -> v1.196.2 (2026-10-26): el dolar A 3500 de un fin de semana o feriado es el del ultimo dia habil (addendum ADR-085). Sin migracion.
    # v1.196.2 -> v1.197.0 (2026-10-26): recibo de un cobro del libro de terceros, por cuenta y orden de (ADR-087). Sin migracion.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.197.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    # El control plane le habla a cada instancia por HTTP.
    "httpx>=0.27,<1",
    "segno>=1.6.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6",
    "ruff>=0.13",
    # Trae el plugin de pytest que corre los tests `async def`. Sin el, los
    # tests del cliente HTTP se saltearian con un warning y la suite quedaria
    # en verde sin haberlos ejecutado.
    "anyio>=4",
    "pytest-xdist>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["libra_backoffice"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Mismo ruleset curado que los otros 12 repos de la familia (fijado 2026-07-31):
# da cero hallazgos hoy, asi que cualquier rojo futuro es una regresion real y
# no deuda vieja. F401 queda afuera a proposito -- los re-exports de `__init__.py`
# son API publica, no imports muertos.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F811",
    "F822",
    "F823",
    "F841",
    "F541",
    "F502", "F506", "F522", "F524",
    "F601", "F602",
]

[tool.coverage.run]
source = ["libra_backoffice"]
branch = true
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true
# Trinquete, no meta: fijado 3 puntos por debajo del 96% que medía el repo al
# crearse, asi que hoy pasa holgado y lo unico que puede ponerlo en rojo es una
# regresion. Cuando la cobertura suba de verdad, subir tambien este numero --
# nunca bajarlo para que pase un cambio.
fail_under = 93
