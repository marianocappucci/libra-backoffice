[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "libra-backoffice"
version = "0.1.0"
description = "Backoffice de superadmin compartido por los 6 productos de la familia Libra."
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # `AdminAuth` (sesion del superadmin del backoffice) y el guard de token de
    # servicio (v0.7.0), que es lo que permite administrar N instancias sin ser
    # usuario de ninguna.
    "libraauth @ git+https://github.com/marianocappucci/libraauth.git@v0.7.0",
    # `admin.services` (inventario y ciclo de vida de instancias) y
    # `security_headers`. v1.3.0: el alta ya no elige un puerto que otro
    # producto del host tiene bindeado, y hace rollback del directorio si el
    # `docker compose up` falla.
    "libracore @ git+https://github.com/marianocappucci/libracore.git@v1.3.0",
    "fastapi>=0.111,<1",
    "uvicorn[standard]>=0.30,<1",
    # El control plane le habla a cada instancia por HTTP.
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6",
    "ruff>=0.13",
    # Trae el plugin de pytest que corre los tests `async def`. Sin el, los
    # tests del cliente HTTP se saltearian con un warning y la suite quedaria
    # en verde sin haberlos ejecutado.
    "anyio>=4",
]

[tool.hatch.build.targets.wheel]
packages = ["libra_backoffice"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Mismo ruleset curado que los otros 12 repos de la familia (fijado 2026-07-31):
# da cero hallazgos hoy, asi que cualquier rojo futuro es una regresion real y
# no deuda vieja. F401 queda afuera a proposito -- los re-exports de `__init__.py`
# son API publica, no imports muertos.
[tool.ruff]
line-length = 120
extend-exclude = ["frontend", "node_modules"]

[tool.ruff.lint]
select = [
    "E9",
    "F63",
    "F7",
    "F811",
    "F822",
    "F823",
    "F841",
    "F541",
    "F502", "F506", "F522", "F524",
    "F601", "F602",
]

[tool.coverage.run]
source = ["libra_backoffice"]
branch = true
omit = ["*/tests/*", "*/.venv/*"]

[tool.coverage.report]
show_missing = true
# Trinquete, no meta: fijado 3 puntos por debajo del 96% que medía el repo al
# crearse, asi que hoy pasa holgado y lo unico que puede ponerlo en rojo es una
# regresion. Cuando la cobertura suba de verdad, subir tambien este numero --
# nunca bajarlo para que pase un cambio.
fail_under = 93
